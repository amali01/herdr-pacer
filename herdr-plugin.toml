id = "herdr-pacer"
name = "Herdr Pacer"
version = "0.6.0"
min_herdr_version = "0.7.5"
description = "Context-window bars in the agent sidebar rows for Claude, Codex and OpenCode, plus the 5h and weekly windows in a dock along the bottom of every tab"
platforms = ["linux", "macos"]

# Codex and OpenCode cannot report their own context, so Herdr pokes us when an
# agent's status changes — which is exactly when a turn has just ended.
[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/pacer-panes.sh\" sweep"]

# The usage dock: a pane along the bottom of every tab. Tabs dock when they are
# created or visited, so a restored session heals as you move around.
[[startup]]
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dock.py\" ensure"]

[[events]]
on = "tab.created"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dock.py\" ensure"]

[[events]]
on = "tab.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dock.py\" ensure"]

[[events]]
on = "workspace.focused"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dock.py\" ensure"]

[[events]]
on = "pane.agent_detected"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/pacer-panes.sh\" event"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/pacer-panes.sh\" event"]

[[actions]]
id = "setup"
title = "Set up herdr-pacer (statusLine wrapper, sidebar row, keybinding)"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/setup.sh\""]

[[actions]]
id = "open"
title = "Open usage"
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-pacer --entrypoint usage --focus"]

[[actions]]
id = "dock-toggle"
title = "Show or hide the usage dock"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/dock.py\" toggle"]

[[actions]]
id = "panes-refresh"
title = "Refresh the context bars now"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/pacer-panes.sh\" sweep"]

[[actions]]
id = "claude-hook-install"
title = "Wrap the Claude Code statusLine (context bars)"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/claude-hook.sh\" install"]

[[actions]]
id = "claude-hook-remove"
title = "Unwrap the Claude Code statusLine"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/claude-hook.sh\" remove"]

[[panes]]
id = "usage"
title = "HERDR usage"
placement = "popup"
width = 72
height = 17
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/usage.sh\""]

# Opened by dock.py as a split along the bottom of each tab.
[[panes]]
id = "dock"
title = "usage"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/usage.sh\" dock"]
