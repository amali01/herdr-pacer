# herdr-pacer — sidebar rows (applied for you by ./setup.sh)
#
# A third row under each agent: the context window of that session, as a dotted
# bar. claude-statusline.sh reports the tokens per pane, so the row shows up
# only for sessions that report one and disappears when a session ends.
#
# The bar carries its color in its token name — the status line reports exactly
# one of ok / warn / hot / crit and clears the others, which is how a value
# picks a color that `rules` cannot match on braille. Thresholds are cc-pacer's:
# green < 50 · orange 50-69 · yellow 70-89 · red >= 90.
#
# `glue = true` needs herdr-glue.patch; without it Herdr puts " · " between the
# used half of the bar and its rail.

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [{ token = "$pacer_ctx_ok_u", fg = "#00af50", glue = true },
   { token = "$pacer_ctx_ok_t", fg = "#46424e", glue = true },
   { token = "$pacer_ctx_warn_u", fg = "#ffb055", glue = true },
   { token = "$pacer_ctx_warn_t", fg = "#46424e", glue = true },
   { token = "$pacer_ctx_hot_u", fg = "#e6c800", glue = true },
   { token = "$pacer_ctx_hot_t", fg = "#46424e", glue = true },
   { token = "$pacer_ctx_crit_u", fg = "#ff5555", glue = true },
   { token = "$pacer_ctx_crit_t", fg = "#46424e", glue = true },
   { token = "$pacer_ctx", dim = true, glue = true }],
]
